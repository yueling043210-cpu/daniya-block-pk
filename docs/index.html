<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#101425" />
  <meta name="description" content="方块 PK · 达妮娅。与三个难度的模拟对手比拼消行分数。" />
  <title>方块 PK · 达妮娅</title>
  <link rel="stylesheet" href="./style.css?v=023" />
  <script defer src="./config.js"></script>
  <script type="module" src="./app.js?v=023"></script>
</head>
<body>
<main class="shell">
  <section class="scoreboard" aria-label="比赛比分">
    <div class="score-side"><div class="small">PLAYER · 玩家</div><div id="playerScore" class="big-score">0</div><div class="muted">消除 <b id="lines">0</b> 行 <span class="sep">·</span> 等级 <b id="level">1</b></div></div>
    <div class="versus"><div class="vs">VS</div><div class="clock" id="clock">01:30</div></div>
    <div class="score-side right"><div class="small">DENIA · 达妮娅</div><div id="botScore" class="big-score bot">0</div><div class="muted" id="botRemark">“别太小看我哦”</div></div>
  </section>

  <section class="arena" aria-label="方块 PK 游戏区">
    <div class="game-card">
      <div id="notice" class="status-note hidden" role="status"></div>
      <div class="board-stage">
        <div id="board" class="board" aria-label="10列20行方块棋盘"></div>
        <div id="readyOverlay" class="ready-overlay"><button id="start" type="button" class="ready-start">开始挑战</button></div>
        <div id="endOverlay" class="end-overlay hidden" role="dialog" aria-modal="false" aria-labelledby="endHeading">
          <div class="end-panel">
            <span class="end-kicker" id="endKicker">MATCH COMPLETE</span>
            <h2 id="endHeading">比赛结束</h2>
            <p id="endDetail" class="end-detail"></p>
            <p id="endLine" class="end-line"></p>
            <p id="endSync" class="end-sync"></p>
            <button id="endReplay" type="button">再来一局 ↗</button>
          </div>
        </div>
      </div>
    </div>
    <aside class="sidepanel" aria-label="下一块和难度">
      <div class="preview-box"><div class="small">NEXT PIECE</div><div id="next" class="next-board"></div></div>
      <div class="difficulty-drawer" aria-label="难度选择">
        <label for="difficultySelect" class="small drawer-heading">难度</label>
        <select id="difficultySelect" class="difficulty-select" aria-label="选择达妮娅的难度">
          <option value="easy">犯困的水蜜桃</option>
          <option value="medium">认真的娅娅</option>
          <option value="hard">邪恶的水蜜桃</option>
        </select>
      </div>
      <div class="chat-panel" aria-label="达妮娅比赛聊天">
        <div class="small chat-heading">DENIA LIVE · 娅娅弹幕 <span class="chat-live-dot"></span></div>
        <div id="chatFeed" class="chat-feed" role="log" aria-live="polite" aria-relevant="additions" aria-label="达妮娅实时对话"></div>
      </div>
    </aside>
  </section>
  <section class="touch" aria-label="手机游戏操作">
    <button id="left" type="button" aria-label="左移">←</button>
    <button id="rotate" type="button" aria-label="旋转">⟳</button>
    <button id="right" type="button" aria-label="右移">→</button>
    <button id="down" type="button" aria-label="向下">↓</button>
    <button id="drop" type="button" aria-label="直落">⇣</button>
  </section>
</main>
</body>
</html>
