<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#101425" />
  <meta name="description" content="方块 PK · 达妮娅。与三个难度的模拟对手比拼消行分数。" />
  <title>方块 PK · 达妮娅</title>
  <link rel="stylesheet" href="./style.css?v=020" />
  <script defer src="./config.js"></script>
  <script type="module" src="./app.js?v=020"></script>
</head>
<body>
<main class="shell">
  <section class="scoreboard" aria-label="比赛比分">
    <div class="score-side"><div class="small">PLAYER · 玩家</div><div id="playerScore" class="big-score">0</div><div class="muted">消除 <b id="lines">0</b> 行 <span class="sep">·</span> 等级 <b id="level">1</b></div></div>
    <div class="versus"><div class="vs">VS</div><div class="clock" id="clock">01:30</div></div>
    <div class="score-side right"><div class="small">DENIA · 达妮娅</div><div id="botScore" class="big-score bot">0</div><div class="muted" id="botRemark">“别太小看我哦”</div></div>
  </section>

  <section class="arena" aria-label="方块 PK 游戏区">
    <div class="game-card">
      <div class="board-heading"><span>PLAYFIELD <span class="live-dot"></span></span><span id="gameStatus">READY</span></div>
      <div id="notice" class="status-note hidden" role="status"></div>
      <div class="board-stage">
        <div id="board" class="board" aria-label="10列20行方块棋盘"></div>
        <div id="danmakuLayer" class="danmaku-layer" aria-hidden="true"></div>
        <div id="endOverlay" class="end-overlay hidden" role="dialog" aria-modal="false" aria-labelledby="endHeading">
          <div class="end-panel">
            <span class="end-kicker" id="endKicker">MATCH COMPLETE</span>
            <h2 id="endHeading">比赛结束</h2>
            <p id="endDetail" class="end-detail"></p>
            <p id="endLine" class="end-line"></p>
            <p id="endSync" class="end-sync"></p>
            <button id="endReplay" type="button">再来一局 ↗</button>
          </div>
        </div>
      </div>
      <p class="hint">方向键移动 · ↑旋转 · 空格直落</p>
    </div>
    <aside class="sidepanel" aria-label="下一块和难度">
      <div class="preview-box"><div class="small">NEXT PIECE</div><div id="next" class="next-board"></div></div>
      <div class="difficulty-drawer" aria-label="难度选择">
        <div class="small drawer-heading">DIFFICULTY · 难度</div>
        <div class="difficulty-list" id="difficultyList">
          <button class="diff-choice is-selected" data-difficulty="easy" type="button" aria-pressed="true" aria-expanded="true">
            <span class="diff-top"><span class="diff-level">简单</span><span class="diff-arrow">⌄</span></span>
            <span class="diff-name">犯困的水蜜桃</span>
            <span class="diff-description">睡眼惺忪，慢慢放块；适合刚上手的玩家。</span>
          </button>
          <button class="diff-choice" data-difficulty="medium" type="button" aria-pressed="false" aria-expanded="false">
            <span class="diff-top"><span class="diff-level">中等</span><span class="diff-arrow">⌄</span></span>
            <span class="diff-name">认真的娅娅</span>
            <span class="diff-description">开始专心消行，速度比休闲模式更快。</span>
          </button>
          <button class="diff-choice" data-difficulty="hard" type="button" aria-pressed="false" aria-expanded="false">
            <span class="diff-top"><span class="diff-level">困难</span><span class="diff-arrow">⌄</span></span>
            <span class="diff-name">终极邪恶水蜜桃</span>
            <span class="diff-description">接近顶尖竞速速度；几乎不给你喘息机会。</span>
          </button>
        </div>
      </div>
    </aside>
  </section>

  <section class="actionbar" aria-label="比赛控制">
    <button id="start" class="primary" type="button">开始挑战 <span>↗</span></button>
    <button id="restart" class="secondary" type="button" disabled>重新开始</button>
  </section>
  <section class="touch" aria-label="手机游戏操作">
    <button id="left" type="button" aria-label="左移">←</button>
    <button id="rotate" type="button" aria-label="旋转">⟳</button>
    <button id="right" type="button" aria-label="右移">→</button>
    <button id="down" type="button" aria-label="向下">↓</button>
    <button id="drop" type="button" aria-label="直落">⇣</button>
  </section>
  <p id="barrageAccessible" class="sr-only" role="status" aria-live="polite"></p>
</main>
</body>
</html>
